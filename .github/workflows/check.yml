name: Project checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-test-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      TEST_MYSQL_URL: mysql://root:ci-test-password@127.0.0.1:3306/
      DATABASE_URL: mysql://root:ci-test-password@127.0.0.1:3306/nuansua-api
      SESSION_SECRET: ci-only-session-secret-never-use-for-production
      ANALYTICS_SALT_SECRET: ci-only-analytics-secret-never-use-for-production
      REVALIDATE_SECRET: ci-only-revalidation-secret-never-use-for-production
      API_URL: http://127.0.0.1:4000
      API_PUBLIC_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3000
      SITE_URL: https://portfolio.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: mysql -h 127.0.0.1 -u root -pci-test-password -e 'CREATE DATABASE `nuansua-api`;'
      - run: npm run db:migrate && npm run db:seed
      - run: |
          npm run build -w @rf/api
          npm run start -w @rf/api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4000/healthz && break || sleep 1; done
          npm run build
      - run: npm audit --omit=dev
